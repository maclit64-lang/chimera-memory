[project]
name = "chimera-memory-types"
version = "0.19.0"
description = "Minimal schema types for chimera-memory — claims, settlements, evidence refs, and temporal seals"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "ORIAS", email = "hello@orias.dev" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/maclit64-lang/chimera-memory"
Source = "https://github.com/maclit64-lang/chimera-memory"
Issues = "https://github.com/maclit64-lang/chimera-memory/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chimera_memory_types"]
artifacts = ["src/chimera_memory_types/py.typed"]
