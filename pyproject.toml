[tool.uv.workspace]
members = [
    "packages/chimera-memory",
    "packages/chimera-memory-types",
]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pytest>=9.0",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
pythonpath = [
    "packages/chimera-memory/src",
    "packages/chimera-memory-types/src",
]
testpaths = ["packages/chimera-memory/tests"]
addopts = "-v --import-mode=importlib"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
]
collect_ignore = ["packages/chimera-memory/tests/test_record_claim.py"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
strict_equality = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B017", "E501", "F841", "B905", "I001"]

[tool.ruff.lint.isort]
known-first-party = [
    "chimera_memory",
    "chimera_memory_types",
]
